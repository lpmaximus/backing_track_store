# Cog do modelo BTC (Bi-directional Transformer for Chord Recognition) para
# publicar no Replicate. Depois de `cog push`, o Replicate devolve um hash de
# versão — coloque-o em REPLICATE_BTC_VERSION no .env do backingtrack.
#
# Deploy: ver README.md nesta pasta.
build:
  # CPU: o BTC é leve, roda bem sem GPU, custo no Replicate é equivalente e
  # simplifica o teste local (não exige GPU NVIDIA no WSL). Para máxima
  # velocidade em alto volume, dá pra trocar por gpu: true + cuda: "11.8".
  gpu: false
  python_version: "3.10"
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
  python_packages:
    - "torch==2.0.1"
    - "numpy==1.23.5"
    - "librosa==0.9.2"
    - "numba==0.56.4"
    - "pyyaml==6.0.1"
    - "mir_eval==0.7"
    - "soundfile==0.12.1"

predict: "predict.py:Predictor"
