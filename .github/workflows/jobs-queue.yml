# Gatilho externo da fila de cifra/letra.
#
# O cron da Vercel (plano Hobby) só roda 1x/dia — pouco demais quando entram
# dezenas ou centenas de separações: job que falhou por erro transitório do
# Replicate esperaria até o dia seguinte. Este workflow chama a cada 5 minutos o
# worker /api/jobs/finalize (poll + retry + submissão da fila) e, 1x/hora, o
# backfill (enfileira o que ficou sem job).
#
# Configuração (uma vez): GitHub → repositório → Settings → Secrets and variables
# → Actions → New repository secret:
#   CRON_SECRET  = o mesmo valor da env CRON_SECRET da Vercel (Production)
#
# Obs.: o GitHub pode atrasar execuções agendadas alguns minutos em horários de
# pico; para a fila isso é irrelevante (o worker é idempotente).
name: jobs-queue

on:
  schedule:
    - cron: "*/5 * * * *"   # worker da fila
    - cron: "7 * * * *"     # backfill (1x/hora)
  workflow_dispatch: {}

concurrency:
  group: jobs-queue
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Worker da fila (poll + retry + submit)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET não configurado"; exit 1; fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.backingtrack.store/api/jobs/finalize"
          echo

      - name: Backfill (enfileira o que ficou sem job)
        if: ${{ github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.backingtrack.store/api/jobs/backfill?limit=200&max=5"
          echo
